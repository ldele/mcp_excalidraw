name: CI

# Minimal, in the cpc §13 shape (tier by trigger; cancel superseded runs; heavy work at a keypoint).
# On every push and PR: ONE Node job that builds and validates the product — and the product here is
# a wireframe reading, not code, so the gate that matters is the fixture corpus (ADR-001: known
# drawings in, expected readings out). The cpc docs gates do not run here: cpc is proprietary and
# never committed (.claude/CONTEXT.md, rule 5), so a CI checkout has no copy of them. They run
# locally before handoff (AGENTS.md).
# The Node-range matrix (engines >= 20) runs only on a `v*` tag or a manual dispatch: it verifies the
# floor, it does not find wireframe regressions, and it used to be six jobs per push.
#
# Cost note (CONVENTIONS §13, ADR-041): this repo is public, so minutes are unmetered; the shape is
# for signal and reading time, not money. Keep it that way if the repo ever goes private.

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is a run nobody will read. Tags are exempt: a release run has to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Build + wireframe corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # One version per push: the corpus needs `node --test` with a glob (Node >= 21), and 22 is
          # the lowest LTS that has it. The engines floor (20) is checked by `compat` at a keypoint.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Type check (frontend)
        run: npm run type-check:frontend
      - name: Build (frontend + server + headless renderer)
        run: npm run build
      - name: Build artifacts present
        run: test -f dist/index.js && test -f dist/server.js && test -f dist/bin.js && test -d dist/frontend && test -f dist/render/excalidraw-node.mjs
      - name: Wireframe fixture corpus (the product's own gate — ADR-001 / SPEC-001)
        run: npm run test:corpus
      - name: Local-bind guard (the canvas binds IPv4 loopback only)
        run: npm run test:bind
      # Upstream's own node-side checks, taken with the 2.1.2 merge (SPEC-002). Its Playwright suite
      # (`npm run test:canvas`) is deliberately NOT here: run it locally before a merge until a run
      # shows it is stable on this fork (SPEC-002 question 4).
      - name: MCP stdio wire test (includes the fork's three tools)
        run: npm run test:mcp
      - name: Headless renderer
        run: npm run test:render
      - name: Canvas state integrity
        run: npm run test:state
      # Upstream's 2.2.0 checks (SPEC-004): its opt-in durable store, the share target, and the
      # MCP file tools' path containment (#148).
      - name: Durable canvas state (upstream's opt-in store)
        run: npm run test:durable
      - name: Share URL
        run: npm run test:share
      - name: File path containment (#148)
        run: npm run test:paths

  compat:
    name: Node ${{ matrix.node }} (keypoint only)
    # Only on a `v*` tag or a manual dispatch — dispatch it BEFORE tagging, so a red can still stop
    # the tag (cpc §13 default 1; ci-pipelines cost guide, lever 1).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Wireframe fixture corpus (Node >= 22 only — `node --test` glob)
        if: matrix.node != '20'
        run: npm run test:corpus
