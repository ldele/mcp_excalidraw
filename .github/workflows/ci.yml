name: CI

# Minimal, in the cpc §13 shape (tier by trigger; cancel superseded runs; heavy work at a keypoint).
# On every push and PR: ONE Node job that builds and validates the product — and the product here is
# a wireframe reading, not code, so the gate that matters is the fixture corpus (ADR-001: known
# drawings in, expected readings out) — plus ONE ten-second docs job running the vendored cpc gates.
# The Node-range matrix (engines >= 18) runs only on a `v*` tag or a manual dispatch: it verifies the
# floor, it does not find wireframe regressions, and it used to be six jobs per push.
#
# Cost note (CONVENTIONS §13, ADR-041): this repo is public, so minutes are unmetered; the shape is
# for signal and reading time, not money. Keep it that way if the repo ever goes private.

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is a run nobody will read. Tags are exempt: a release run has to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Build + wireframe corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # One version per push: the corpus needs `node --test` with a glob (Node >= 21), and 22 is
          # the lowest LTS that has it. The engines floor (18) is checked by `compat` at a keypoint.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build (frontend + server)
        run: npm run build
      - name: Build artifacts present
        run: test -f dist/index.js && test -f dist/server.js && test -f dist/bin.js && test -d dist/frontend
      - name: Wireframe fixture corpus (the product's own gate — ADR-001 / SPEC-001)
        run: npm run test:corpus
      - name: Local-bind guard (the canvas binds IPv4 loopback only)
        run: npm run test:bind

  docs:
    name: cpc docs + integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is required: rule 12 compares a living doc's `updated:` header against the
      # date of the last commit that touched it, and a shallow clone has no such date.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # The gates are VENDORED at tools/conventions/cpc/ (cpc ADR-015); stdlib only, nothing fetched.
      # Same two commands as `just lint` — CI calls them directly, never `just` (cpc ADR-011).
      - run: PYTHONPATH=tools/conventions python -m cpc.docs_check --root . --strict
      - run: PYTHONPATH=tools/conventions python -m cpc.integrity_check --root . --strict

  compat:
    name: Node ${{ matrix.node }} (keypoint only)
    # Only on a `v*` tag or a manual dispatch — dispatch it BEFORE tagging, so a red can still stop
    # the tag (cpc §13 default 1; ci-pipelines cost guide, lever 1).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Wireframe fixture corpus (Node >= 22 only — `node --test` glob)
        if: matrix.node != '18' && matrix.node != '20'
        run: npm run test:corpus
