name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          echo "Checking if build artifacts exist..."
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/server.js || (echo "dist/server.js not found" && exit 1)
          test -d dist/frontend || (echo "dist/frontend not found" && exit 1)
          echo "All build artifacts present!"

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The corpus suite only runs on 22.x and up: `node --test` takes a glob
        # from Node 21, and directory discovery no longer works on current Node.
        # The package itself still supports Node >= 18 — that is what the
        # build-and-test matrix above covers.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wireframe fixture corpus
        run: npm run test:corpus

      - name: Local-bind guard
        run: npm run test:bind

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for TypeScript errors
        run: npm run type-check
